# The demo-request endpoint. Deployed separately from the site, which is a
# static export on GitHub Pages and has no server of its own.
#
# NOTHING SECRET BELONGS IN THIS FILE. The repository is public and git history
# is permanent. The addresses below are mailboxes meant to be written to, not
# credentials. The Resend API key is a credential and goes in
# `wrangler secret put RESEND_API_KEY` — never here, not even briefly.
name = "masjidone-forms"
main = "src/index.js"
compatibility_date = "2026-10-02"

# TRUE, AND IT HAS TO BE. This was a custom route on forms.masjidone.co.uk,
# which needs the zone on Cloudflare DNS. It is not — masjidone.co.uk is on
# One.com, and moving it would cost One.com's automatic DKIM. So the Worker
# answers on its free workers.dev hostname instead:
#
#   https://masjidone-forms.<your-subdomain>.workers.dev/demo-request
#
# `wrangler deploy` prints the real hostname. That exact URL, with the path, is
# what NEXT_PUBLIC_FORM_ENDPOINT must be set to.
#
# The hostname is visible to anyone reading the page source. That is fine: the
# endpoint is meant to be posted to by strangers, it accepts nothing but this
# one form, and it checks Origin, rate-limits per IP and holds no data.
workers_dev = true

[vars]
# The From address. Must be on the domain verified in Resend. It is a SUBDOMAIN
# on purpose — Resend's SPF, DKIM and bounce records then live on
# send.masjidone.co.uk and cannot collide with the root SPF record or disturb
# the MX that the One.com mailboxes depend on.
#
# This is the From, not the reply address: the enquirer's own address goes in
# reply_to, set by the Worker from the submitted form.
SEND_FROM = "forms@send.masjidone.co.uk"

# Where enquiries land. A real mailbox at One.com, and the same address as
# CONTACT_EMAIL in lib/site.ts — so there is nothing here that was not already
# printed on the website.
#
# USE A MASJIDONE ADDRESS, NOT A PERSONAL ONE. Public repository, permanent
# history.
SEND_TO = "info@masjidone.co.uk"

# 5 submissions per minute per IP. Generous for a person filling in one form,
# useless to anybody trying to flood the inbox. Nothing to create first — the
# namespace id is just an integer label scoped to your account.
#
# Cloudflare's own guidance says not to key a rate limit on IP, because many
# people can share one. That guidance is about limiting IDENTIFIED users, and
# here there are none: the whole point of the endpoint is that anybody may post
# to it without signing in, so the connecting IP is the only stable thing that
# is not supplied by the sender. The cost of the shared-IP case is a committee
# behind one office connection being asked to wait a minute after their fifth
# submission, which is not a real failure for this form.
#
# The limit is per Cloudflare location and eventually consistent, so treat it as
# a flood guard rather than an accounting system.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1"

  [ratelimits.simple]
  limit = 5
  period = 60
