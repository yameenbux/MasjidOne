name: Deploy to GitHub Pages

# The site is now a Next.js app exported to static files, so Pages cannot
# serve it straight from a branch — it has to be built first.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The sitemap stamps every URL with this rather than the build date, so a
      # deploy that changed nothing does not tell crawlers three pages changed.
      - name: Record the commit date for the sitemap
        run: echo "COMMIT_DATE=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          # Set this to "/MasjidOne" if the site is served from
          # <user>.github.io/MasjidOne rather than a custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_COMMIT_DATE: ${{ env.COMMIT_DATE }}
          # Where the demo request form posts. Unset, the form falls back to
          # handing its answers to the visitor's own mail client. Set, it posts
          # to the Worker in worker/ and the privacy notice's wording changes
          # with it — both read this one value, so they cannot disagree.
          #   https://forms.masjidone.co.uk/demo-request
          # This line was missing, which would have been an expensive silence:
          # setting the repository variable would have changed nothing, the
          # deploy would have gone green, and the form would have quietly kept
          # using the mailto fallback.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
          # Where the Direct Debit panel in the support console asks Stripe for
          # a mandate link. Unset, that panel says so in a sentence rather than
          # offering a button that cannot work.
          #   https://<project>.supabase.co/functions/v1/masjidone-billing
          # Listed here for the same reason as the line above, and found by
          # reading that comment: without it, setting the repository variable
          # would change nothing, the deploy would go green, and the panel
          # would keep reporting itself undeployed with no way to tell why.
          NEXT_PUBLIC_BILLING_ENDPOINT: ${{ vars.NEXT_PUBLIC_BILLING_ENDPOINT }}
          # Only needed for a Search Console URL-prefix property. A Domain
          # property is verified by DNS at the registrar and needs nothing here.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
